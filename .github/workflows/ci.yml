name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "assets/**"
      - "packaging/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: nikolareljin/ci-helpers/.github/workflows/rust.yml@production
    with:
      rust_toolchain: "stable"
      lint_command: "cargo fmt -- --check && cargo clippy -- -D warnings"
      test_command: "cargo test --verbose"
      build_command: "cargo build --release --verbose"
