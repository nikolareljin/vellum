name: Deb Build

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc*"
      - "[0-9]*.[0-9]*.[0-9]*-RC*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deb:
    uses: nikolareljin/ci-helpers/.github/workflows/deb-build.yml@production
    with:
      prebuild_command: "cargo install cargo-deb --locked"
      build_command: "cargo deb"
      artifact_glob: "target/debian/*.deb"
