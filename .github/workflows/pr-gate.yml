name: PR Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-gate:
    uses: nikolareljin/ci-helpers/.github/workflows/pr-gate.yml@production
    with:
      rust_toolchain: "stable"
      check_release_tag: true
      release_branch: ${{ github.head_ref }}
      lint_command: "cargo fmt -- --check && cargo clippy -- -D warnings"
      test_command: "cargo test --verbose"
      build_command: "cargo build --release --verbose"
