name: Release tarballs

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc*"
      - "[0-9]*.[0-9]*.[0-9]*-RC*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-tarballs:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-14
            platform: macos-x86_64
            rust_target: x86_64-apple-darwin
            macos_deployment_target: "10.13"
          - os: ubuntu-latest
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-22

      - name: Build release binary
        id: build
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          MACOS_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          set -euo pipefail
          if [ -n "$RUST_TARGET" ]; then
            [ -n "$MACOS_DEPLOYMENT_TARGET" ] && export MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"
            rustup target add "$RUST_TARGET"
            cargo build --release --target "$RUST_TARGET"
            bin_path="target/$RUST_TARGET/release/vellum"
          else
            cargo build --release
            bin_path="target/release/vellum"
          fi
          [ -f "$bin_path" ] || { echo "::error::Binary not found at $bin_path"; exit 1; }
          echo "bin_path=$bin_path" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        id: package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tarball="vellum-${tag}-${PLATFORM}.tar.gz"
          bin_dir="$(dirname "${{ steps.build.outputs.bin_path }}")"
          tar -czf "$tarball" -C "$bin_dir" vellum
          if command -v shasum >/dev/null 2>&1; then
            sha256="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          else
            sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.package.outputs.tarball }}
          update_existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write sha metadata
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          printf "%s  %s\n" "$SHA256" "$TARBALL" > "sha256-${PLATFORM}.txt"

      - name: Upload sha artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.platform }}
          path: sha256-${{ matrix.platform }}.txt

  bump-homebrew:
    name: Bump Homebrew formula
    needs: build-tarballs
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        shell: bash
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
        run: |
          set -euo pipefail
          errors=()
          [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ] && errors+=("HOMEBREW_TAP_GITHUB_TOKEN not set")
          [ -z "${HOMEBREW_TAP_REPO:-}" ]         && errors+=("HOMEBREW_TAP_REPO not set")
          if [ ${#errors[@]} -gt 0 ]; then
            printf "::error::%s\n" "${errors[@]}"
            exit 1
          fi

      - name: Download sha artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true

      - name: Checkout tap repo
        shell: bash
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap

      - name: Update formula
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          sha_arm64="$(awk '{print $1}' sha256-macos-arm64.txt)"
          sha_x86_64="$(awk '{print $1}' sha256-macos-x86_64.txt)"
          sha_linux="$(awk '{print $1}'  sha256-linux-x86_64.txt)"

          VERSION="$version" SHA_ARM64="$sha_arm64" SHA_X86_64="$sha_x86_64" SHA_LINUX="$sha_linux" \
          python3 - <<'PY'
          import re, os
          from pathlib import Path

          v        = os.environ["VERSION"]
          arm64    = os.environ["SHA_ARM64"]
          x86_64   = os.environ["SHA_X86_64"]
          linux    = os.environ["SHA_LINUX"]

          for sha, name in [(arm64,"arm64"),(x86_64,"x86_64"),(linux,"linux")]:
              if not re.match(r'^[0-9a-f]{64}$', sha):
                  raise SystemExit(f"Invalid SHA256 for {name}: {sha}")

          formula = Path("tap/Formula/vellum.rb")
          content = f'''class Vellum < Formula
            desc "Rich Markdown viewer for the terminal"
            homepage "https://github.com/nikolareljin/vellum"
            version "{v}"
            tag = version

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/nikolareljin/vellum/releases/download/#{{tag}}/vellum-#{{tag}}-macos-arm64.tar.gz"
                sha256 "{arm64}"
              else
                url "https://github.com/nikolareljin/vellum/releases/download/#{{tag}}/vellum-#{{tag}}-macos-x86_64.tar.gz"
                sha256 "{x86_64}"
              end
            end

            on_linux do
              url "https://github.com/nikolareljin/vellum/releases/download/#{{tag}}/vellum-#{{tag}}-linux-x86_64.tar.gz"
              sha256 "{linux}"
            end

            def install
              bin.install "vellum"
            end

            test do
              assert_match "vellum", shell_output("#{{bin}}/vellum --help")
            end
          end
          '''
          formula.write_text(content)
          print("Formula written.")
          PY

      - name: Validate formula syntax
        run: ruby -c tap/Formula/vellum.rb

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Formula/vellum.rb; then
            git add Formula/vellum.rb
            git commit -m "Update vellum to ${GITHUB_REF_NAME}"
            for i in 1 2 3; do
              git push && break
              [ "$i" -lt 3 ] && git pull --rebase && sleep 2
            done
          fi
