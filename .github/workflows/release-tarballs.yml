name: Release tarballs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build tarballs for (e.g. 0.6.0). Leave empty to use the pushed tag."
        required: false
        default: ""
# Manual backfill only. A release builds the tarballs through release.yml.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tarballs:
    uses: nikolareljin/ci-helpers/.github/workflows/rust-release-tarballs.yml@production
    with:
      bin_name: "vellum"
      desc: "Rich Markdown viewer for the terminal"
      homepage: "https://github.com/nikolareljin/vellum"
      release_tag: ${{ inputs.release_tag }}
    secrets:
      tap_repo: ${{ secrets.HOMEBREW_TAP_REPO }}
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
