name: Release tarballs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build tarballs for (e.g. 0.6.0). Leave empty to use the pushed tag."
        required: false
        default: ""
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc*"
      - "[0-9]*.[0-9]*.[0-9]*-RC*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tarballs:
    uses: nikolareljin/ci-helpers/.github/workflows/rust-release-tarballs.yml@production
    with:
      bin_name: "vellum"
      desc: "Rich Markdown viewer for the terminal"
      homepage: "https://github.com/nikolareljin/vellum"
      tap_repo: "nikolareljin/homebrew-tap"
      release_tag: ${{ inputs.release_tag }}
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
