[package]
name = "vellum"
version = "0.5.0"
edition = "2021"
description = "Rich Markdown viewer for the terminal — renders text, images, code, and links in a full TUI"
license = "MIT"
repository = "https://github.com/nikolareljin/vellum"
authors = ["Nik Reljin <nikola.reljin@gmail.com>"]

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui       = "0.29"
crossterm     = "0.28"

# Markdown parsing
pulldown-cmark = "0.12"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Syntax highlighting in code blocks
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Inline image rendering (Kitty / Sixel / iTerm2 auto-detect)
ratatui-image = "6"
image         = "0.25"

# Error handling
anyhow    = "1"
thiserror = "2"

# Temporary files (video thumbnails)
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
