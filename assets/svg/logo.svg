<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vellum-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vellum-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="vellum-quill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>

  <!-- Rounded terminal / page frame -->
  <rect x="16" y="20" width="96" height="88" rx="14" ry="14" fill="url(#vellum-bg)"/>

  <!-- Top bar dots (CLI / terminal hint) -->
  <circle cx="32" cy="34" r="4" fill="#f97316"/>
  <circle cx="46" cy="34" r="4" fill="#facc15"/>
  <circle cx="60" cy="34" r="4" fill="#22c55e"/>

  <!-- Markdown-ish lines / content -->
  <g stroke="url(#vellum-accent)" stroke-linecap="round" stroke-width="4">
    <line x1="32" y1="52" x2="80" y2="52"/>
    <line x1="32" y1="66" x2="72" y2="66"/>
  </g>
  <g stroke="#4b5563" stroke-linecap="round" stroke-width="3">
    <line x1="32" y1="80" x2="88" y2="80"/>
    <line x1="32" y1="94" x2="76" y2="94"/>
  </g>

  <!-- Quill / feather (Vellum / writing metaphor) -->
  <g transform="translate(88 46) rotate(-32)">
    <!-- Feather body -->
    <ellipse cx="0" cy="0" rx="7" ry="20" fill="url(#vellum-quill)" opacity="0.92"/>
    <!-- Quill spine -->
    <line x1="0" y1="-20" x2="0" y2="22" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Barbs left -->
    <line x1="0" y1="-14" x2="-5" y2="-8"  stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="0" y1="-6"  x2="-6" y2="0"   stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="0" y1="2"   x2="-6" y2="8"   stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="0" y1="10"  x2="-5" y2="15"  stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Barbs right -->
    <line x1="0" y1="-14" x2="5"  y2="-8"  stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="0" y1="-6"  x2="6"  y2="0"   stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="0" y1="2"   x2="6"  y2="8"   stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="0" y1="10"  x2="5"  y2="15"  stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Nib tip -->
    <path d="M -2 18 Q 0 24 2 18" fill="#fbbf24"/>
  </g>
</svg>
